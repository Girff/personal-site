name: Update Letterboxd data

on:
  schedule:
    - cron: '17 6 * * *' # daily, 6:17 UTC
  workflow_dispatch: {}   # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Letterboxd data
        run: python3 scripts/fetch_letterboxd.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/letterboxd.json assets/data/letterboxd.js
          git diff --staged --quiet || { git commit -m "Update Letterboxd data"; git push; }
